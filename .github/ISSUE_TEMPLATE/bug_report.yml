name: Bug report
description: Report a problem with DynaPlex
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. A short, self-contained
        reproduction script lets us find and fix the problem much faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >-
        What did you do, what did you expect to happen, and what happened
        instead? Include the full error message or traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction script
      description: >-
        A short, self-contained Python script that reproduces the problem.
        Note that DynaML functions must live in a real .py file — a REPL
        paste is usually not enough.
      render: python
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Output of `python -m dynaplex.selftest`
      description: >-
        Paste the full output, including the environment block and the
        per-check lines (it covers your Python version and platform details).
      render: text
    validations:
      required: true
  - type: input
    id: dynaplex-version
    attributes:
      label: DynaPlex version
      description: '`python -c "import dynaplex; print(dynaplex.__version__)"`'
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Windows (AMD64)
        - Other
    validations:
      required: true
  - type: input
    id: pytorch
    attributes:
      label: PyTorch version (if relevant)
      description: Only needed for issues involving the RL algorithms.
    validations:
      required: false
